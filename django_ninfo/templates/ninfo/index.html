{% load static %}
<!DOCTYPE html>
<!--
  @decision DEC-ROUTE-001
  @title Alpine.js SPA — hash-based routing, inline views
  @status accepted
  @rationale AngularJS 1.2.6 + jQuery replaced with Alpine.js 3.x (CDN, no
  build step). Single/Multiple views inlined via x-show instead of separate
  partial files. All API calls use /api/ (not /ninfo/api/). The Bootstrap 5
  dark/light theme toggle (color-modes.js) is preserved unchanged.
-->
<html lang="en" data-bs-theme="auto">
  <head>
    <script src="{% static "ninfo/bootstrap/js/color-modes.js" %}"></script>
    <meta charset="utf-8">
    <title>nInfo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <meta name="author" content="">

    <!-- Styles -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@docsearch/css@3">
    <link href="{% static "ninfo/bootstrap/css/bootstrap.min.css" %}" rel="stylesheet">
    <link href="{% static "ninfo/css/navbar-fixed.css" %}" rel="stylesheet">

    <style>
      body {
        padding-top: 60px;
      }
      div.plugin_result {
        max-height: 400px;
        overflow: auto;
      }

      .bd-placeholder-img {
        font-size: 1.125rem;
        text-anchor: middle;
        -webkit-user-select: none;
        -moz-user-select: none;
        user-select: none;
      }

      @media (min-width: 768px) {
        .bd-placeholder-img-lg {
          font-size: 3.5rem;
        }
      }

      .b-example-divider {
        width: 100%;
        height: 3rem;
        background-color: rgba(0, 0, 0, .1);
        border: solid rgba(0, 0, 0, .15);
        border-width: 1px 0;
        box-shadow: inset 0 .5em 1.5em rgba(0, 0, 0, .1), inset 0 .125em .5em rgba(0, 0, 0, .15);
      }

      .b-example-vr {
        flex-shrink: 0;
        width: 1.5rem;
        height: 100vh;
      }

      .bi {
        vertical-align: -.125em;
        fill: currentColor;
      }

      .nav-scroller {
        position: relative;
        z-index: 2;
        height: 2.75rem;
        overflow-y: hidden;
      }

      .nav-scroller .nav {
        display: flex;
        flex-wrap: nowrap;
        padding-bottom: 1rem;
        margin-top: -1px;
        overflow-x: auto;
        text-align: center;
        white-space: nowrap;
        -webkit-overflow-scrolling: touch;
      }

      .btn-bd-primary {
        --bd-violet-bg: #712cf9;
        --bd-violet-rgb: 112.520718, 44.062154, 249.437846;

        --bs-btn-font-weight: 600;
        --bs-btn-color: var(--bs-white);
        --bs-btn-bg: var(--bd-violet-bg);
        --bs-btn-border-color: var(--bd-violet-bg);
        --bs-btn-hover-color: var(--bs-white);
        --bs-btn-hover-bg: #6528e0;
        --bs-btn-hover-border-color: #6528e0;
        --bs-btn-focus-shadow-rgb: var(--bd-violet-rgb);
        --bs-btn-active-color: var(--bs-btn-hover-color);
        --bs-btn-active-bg: #5a23c8;
        --bs-btn-active-border-color: #5a23c8;
      }

      .bd-mode-toggle {
        z-index: 1500;
      }

      .bd-mode-toggle .dropdown-menu .active .bi {
        display: block !important;
      }

      .search-clear-btn {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 5;
        background-color: transparent;
        opacity: 0.6;
        padding: 0.25rem;
      }

      .search-clear-btn:hover {
        opacity: 1;
      }

      /* Add padding to input to prevent text going under the clear button */
      .input-group input[type="search"] {
        padding-right: 35px;
      }
    </style>
  </head>

  <body>
    <!-- SVG sprite for theme toggle icons -->
    <svg xmlns="http://www.w3.org/2000/svg" class="d-none">
      <symbol id="check2" viewBox="0 0 16 16">
        <path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/>
      </symbol>
      <symbol id="circle-half" viewBox="0 0 16 16">
        <path d="M8 15A7 7 0 1 0 8 1v14zm0 1A8 8 0 1 1 8 0a8 8 0 0 1 0 16z"/>
      </symbol>
      <symbol id="moon-stars-fill" viewBox="0 0 16 16">
        <path d="M6 .278a.768.768 0 0 1 .08.858 7.208 7.208 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277.527 0 1.04-.055 1.533-.16a.787.787 0 0 1 .81.316.733.733 0 0 1-.031.893A8.349 8.349 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.752.752 0 0 1 6 .278z"/>
        <path d="M10.794 3.148a.217.217 0 0 1 .412 0l.387 1.162c.173.518.579.924 1.097 1.097l1.162.387a.217.217 0 0 1 0 .412l-1.162.387a1.734 1.734 0 0 0-1.097 1.097l-.387 1.162a.217.217 0 0 1-.412 0l-.387-1.162A1.734 1.734 0 0 0 9.31 6.593l-1.162-.387a.217.217 0 0 1 0-.412l1.162-.387a1.734 1.734 0 0 0 1.097-1.097l.387-1.162zM13.863.099a.145.145 0 0 1 .274 0l.258.774c.115.346.386.617.732.732l.774.258a.145.145 0 0 1 0 .274l-.774.258a1.156 1.156 0 0 0-.732.732l-.258.774a.145.145 0 0 1-.274 0l-.258-.774a1.156 1.156 0 0 0-.732-.732l-.774-.258a.145.145 0 0 1 0-.274l.774-.258c.346-.115.617-.386.732-.732L13.863.1z"/>
      </symbol>
      <symbol id="sun-fill" viewBox="0 0 16 16">
        <path d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0zm0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13zm8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5zM3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8zm10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0zm-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0zm9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707zM4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708z"/>
      </symbol>
    </svg>

    <!-- Bootstrap 5 dark/light/auto theme toggle (standalone — not Alpine) -->
    <div class="dropdown position-fixed bottom-0 end-0 mb-3 me-3 bd-mode-toggle">
      <button class="btn btn-bd-primary py-2 dropdown-toggle d-flex align-items-center"
              id="bd-theme"
              type="button"
              aria-expanded="false"
              data-bs-toggle="dropdown"
              aria-label="Toggle theme (auto)">
        <svg class="bi my-1 theme-icon-active" width="1em" height="1em"><use href="#circle-half"></use></svg>
        <span class="visually-hidden" id="bd-theme-text">Toggle theme</span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="bd-theme-text">
        <li>
          <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="light" aria-pressed="false">
            <svg class="bi me-2 opacity-50" width="1em" height="1em"><use href="#sun-fill"></use></svg>
            Light
            <svg class="bi ms-auto d-none" width="1em" height="1em"><use href="#check2"></use></svg>
          </button>
        </li>
        <li>
          <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="dark" aria-pressed="false">
            <svg class="bi me-2 opacity-50" width="1em" height="1em"><use href="#moon-stars-fill"></use></svg>
            Dark
            <svg class="bi ms-auto d-none" width="1em" height="1em"><use href="#check2"></use></svg>
          </button>
        </li>
        <li>
          <button type="button" class="dropdown-item d-flex align-items-center active" data-bs-theme-value="auto" aria-pressed="true">
            <svg class="bi me-2 opacity-50" width="1em" height="1em"><use href="#circle-half"></use></svg>
            Auto
            <svg class="bi ms-auto d-none" width="1em" height="1em"><use href="#check2"></use></svg>
          </button>
        </li>
      </ul>
    </div>

    <!-- ================================================================
         Navbar — contains the persistent single-lookup search form.
         x-data="singleComponent" spans both the navbar AND the single
         view below (they share the same Alpine component instance via a
         common ancestor element wrapping both).
         ================================================================ -->
    <div x-data="singleComponent">

      <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="#/single">Ninfo</a>
          <button class="navbar-toggler" type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#navbarCollapse"
                  aria-controls="navbarCollapse"
                  aria-expanded="false"
                  aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarCollapse">
            <ul class="navbar-nav me-2 mb-2 mb-md-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#/multiple">Multi Search</a>
              </li>
            </ul>

            <!-- Search form — always visible, drives single-view route -->
            <form class="d-flex flex-grow-1 me-2" @submit.prevent="lookup()">
              <div class="input-group">
                <div class="position-relative flex-grow-1">
                  <input type="search"
                         class="form-control"
                         placeholder="Search"
                         x-model="searchArg"
                         required
                         aria-label="Search">
                  <button type="button"
                          class="btn-close search-clear-btn"
                          aria-label="Clear search"
                          @click="searchArg = ''"
                          x-show="searchArg"></button>
                </div>
                <button class="btn btn-outline-light" type="submit">Search</button>
              </div>
            </form>
          </div>
        </div>
      </nav>

      <!-- ==============================================================
           Single view — shown when route is #/single[/arg]
           ============================================================== -->
      <main class="container" x-show="$store.route.view === 'single'">

        <!-- Progress bar + plugin nav pills (shown after a search starts) -->
        <div class="bg-body-tertiary p-3 rounded mt-4 mb-3" x-show="status.started">

          <!-- Three-segment progress bar: success / empty / error -->
          <div class="progress mb-3" style="height: 20px;">
            <div class="progress-bar bg-success"
                 role="progressbar"
                 :style="{ width: barSuccessWidth }"
                 aria-valuemin="0"
                 aria-valuemax="100"
                 x-text="status.success"></div>
            <div class="progress-bar bg-warning"
                 role="progressbar"
                 :style="{ width: barEmptyWidth }"
                 aria-valuemin="0"
                 aria-valuemax="100"
                 x-text="status.empty"></div>
            <div class="progress-bar bg-danger"
                 role="progressbar"
                 :style="{ width: barErrorWidth }"
                 aria-valuemin="0"
                 aria-valuemax="100"
                 x-text="status.error"></div>
          </div>

          <!-- Plugin navigation pills — one per plugin that has a result -->
          <nav>
            <ul class="nav nav-pills gap-2 flex-wrap">
              <template x-for="p in plugins" :key="p.name">
                <li class="nav-item" x-show="p.checked && p.hasResult">
                  <button class="nav-link btn btn-link px-3 py-1"
                          type="button"
                          @click="scrollTo(p.name)"
                          x-text="p.name"></button>
                </li>
              </template>
            </ul>
          </nav>
        </div>

        <!-- Plugin result cards -->
        <template x-for="p in plugins" :key="p.name">
          <div x-show="p.checked && p.hasResult"
               :id="'result_' + p.name"
               class="bg-body-tertiary p-3 rounded mb-3">
            <h2 x-text="p.title"></h2>
            <div x-html="p.resultHtml"></div>
          </div>
        </template>

      </main>
    </div><!-- /singleComponent wrapper -->

    <!-- ================================================================
         Multiple view — shown when route is #/multiple
         ================================================================ -->
    <main class="container" x-data="multipleComponent" x-show="$store.route.view === 'multiple'">

      <div class="bg-body-tertiary p-3 rounded mt-4 mb-3">
        <h3>Multiple Search</h3>

        <!-- Progress bar -->
        <div class="progress mb-3" style="height: 20px;" x-show="status.started">
          <div class="progress-bar bg-success"
               role="progressbar"
               :style="{ width: barSuccessWidth }"
               aria-valuemin="0"
               aria-valuemax="100"
               x-text="status.success"></div>
          <div class="progress-bar bg-warning"
               role="progressbar"
               :style="{ width: barEmptyWidth }"
               aria-valuemin="0"
               aria-valuemax="100"
               x-text="status.empty"></div>
          <div class="progress-bar bg-danger"
               role="progressbar"
               :style="{ width: barErrorWidth }"
               aria-valuemin="0"
               aria-valuemax="100"
               x-text="status.error"></div>
        </div>

        <!-- Lookup form -->
        <form @submit.prevent="lookup()">
          <fieldset>
            <div class="input-group">
              <span class="input-group-text">Multi Search</span>
              <textarea rows="8" class="form-control" x-model="q"></textarea>
            </div>
            <button type="submit" class="btn btn-primary my-1">Lookup</button>

            <legend>Select Plugins</legend>
            <div class="form-check form-check-inline">
              <a class="btn btn-primary my-1" role="button" @click="toggleAll()">toggle all</a>
            </div>
            <template x-for="p in plugins" :key="p.name">
              <div class="form-check form-check-inline">
                <label class="form-check-label">
                  <input class="form-check-input" type="checkbox" x-model="p.checked">
                  <span x-text="p.title"></span>
                </label>
              </div>
            </template>
          </fieldset>
        </form>
      </div>

      <!-- Results: one card per arg -->
      <template x-for="argObj in args" :key="argObj.value">
        <div class="bg-body-tertiary p-3 rounded mb-2">
          <h3 x-text="argObj.value"></h3>
          <template x-for="p in activatedPlugins" :key="p.name">
            <div x-show="argObj.results[p.name] && argObj.results[p.name].hasResult"
                 class="bg-body-tertiary p-3 rounded mb-3">
              <h4 x-text="p.title"></h4>
              <div x-html="argObj.results[p.name] ? argObj.results[p.name].html : ''"></div>
            </div>
          </template>
        </div>
      </template>

    </main>

    <!--
      Script loading order:
        1. Bootstrap (sync — needed for theme toggle dropdown)
        2. app.js (defer) — registers Alpine components + router via alpine:init
        3. Alpine.js (defer) — must come AFTER app.js so alpine:init listeners
           are already attached when Alpine fires the event
      Both app.js and Alpine use `defer` so they execute after DOM parsing,
      in document order (app.js first, then Alpine).
    -->
    <script src="{% static "ninfo/bootstrap/js/bootstrap.bundle.min.js" %}"></script>
    <script defer src="{% static "ninfo/js/app.js" %}"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  </body>
</html>
